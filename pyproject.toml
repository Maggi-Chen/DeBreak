[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "debreak"
version = "1.3"
description = "SV caller for long-read single-molecule sequencing data"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Maggi Chen" }]
requires-python = ">=3.8"
dependencies = ["pysam"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
]

# External (non-Python) tools, not installable via pip:
#   minimap2  - --rescue_dup, --rescue_large_ins, --poa
#   wtdbg2    - --rescue_large_ins
#   bsalign   - --poa

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Maggi-Chen/DeBreak"

[tool.setuptools]
# Flat layout: top-level modules imported by the `debreak` script.
py-modules = [
    "debreak_detect",
    "debreak_merge",
    "debreak_merge_contig",
    "debreak_merge_cluster",
    "debreak_genotype",
    "debreak_writevcf",
    "debreak_allpoa",
    "debreak_rescuedupfromins",
    "debreak_rescuelargeins",
    "debreak_resdup_selfalignment",
    "complexsv",
    "genefusion",
]
# `debreak` has no main() yet, so it is installed as-is (same as the bioconda
# recipe). After the refactor replace this with:
#   [project.scripts]
#   debreak = "debreak_cli:main"
script-files = ["debreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# E2E tests run `debreak` in a subprocess, which forks multiprocessing workers;
# measure all of them, not only the pytest process.
patch = ["subprocess"]
concurrency = ["multiprocessing"]
parallel = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
